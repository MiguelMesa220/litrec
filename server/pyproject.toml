[project]
name = "litrec"
version = "0.1.0"
description = "Social platform for discovering, sharing and tracking books"
readme = "README.md"
authors = [
    { name = "Miguel Mesa", email = "miguelmesa220@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
